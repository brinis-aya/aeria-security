name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # every Monday: new vulnerabilities in the Aeria dependencies

jobs:
  wazuh-rules:
    name: Wazuh decoders and rules (wazuh-logtest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Well-formed XML
        run: |
          for f in wazuh/decoders/*.xml wazuh/rules/*.xml; do
            python3 -c "import sys, xml.dom.minidom as m; m.parseString('<root>' + open(sys.argv[1]).read().split('-->', 1)[-1] + '</root>')" "$f"
          done
      - name: Start a disposable Wazuh manager (same version as the lab)
        run: |
          docker run -d --name wazuh wazuh/wazuh-manager:4.14.9
          for i in $(seq 1 60); do
            echo test | docker exec -i wazuh /var/ossec/bin/wazuh-logtest 2>&1 | grep -q "Phase 1" && break
            sleep 5
          done
      - name: Replay the 15 attack scenarios
        run: python3 scripts/test_wazuh_rules.py --container wazuh

  dependencies:
    name: Known vulnerabilities in the Aeria dependencies (OSV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch the modules
        run: |
          for r in aeria-iot-sensors aeria-backoffice aeria-forecast; do
            git clone --depth 1 "https://github.com/brinis-aya/$r.git" "../$r"
          done
      - name: Resolve Maven dependencies
        run: |
          for r in aeria-iot-sensors aeria-backoffice; do
            (cd "../$r" && mvn -B -q dependency:list -DincludeScope=runtime -DoutputFile="$PWD/../deps-$r.txt")
          done
      - name: Query osv.dev
        run: |
          python3 scripts/osv_scan.py \
            --maven aeria-iot-sensors=../deps-aeria-iot-sensors.txt \
            --maven aeria-backoffice=../deps-aeria-backoffice.txt \
            --pypi aeria-forecast=../aeria-forecast/requirements.txt \
            --out osv-report.json | tee osv-summary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: osv-report
          path: |
            osv-report.json
            osv-summary.txt
